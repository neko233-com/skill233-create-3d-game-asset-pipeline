name: CI

# Every commit on main is verified on all three desktop platforms. The Go
# pipeline needs no Blender: testing/fake_blender.py drives the real bpy stage
# scripts with mock_bpy, so CI never installs Blender 5.2.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Python (test harness only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: One-shot production verification
        shell: bash
        run: go run ./cmd/assetctl verify

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          if-no-files-found: warn

      - name: Confirm default supplier contract
        shell: bash
        run: |
          go run ./cmd/assetctl strategies | grep -E 'tripo.*YES'
          go run ./cmd/assetctl stages | grep -c . | grep -x 6
